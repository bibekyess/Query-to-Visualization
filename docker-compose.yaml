name: query-to-viz-project

services:
  api:
    build: .
    image: bibekyess/query-to-viz-agent:0.1.0
    # Not published to the public internet — Caddy proxies it over the internal
    # network. Bound to localhost so it stays reachable for local debugging.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:v10.5.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DOZZLE_FILTER: "label=com.docker.compose.project=query-to-viz-project"
      DOZZLE_AUTH_PROVIDER: none
      DOZZLE_BASE: /logs

